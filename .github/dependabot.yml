version: 2

# Commit prefixes follow the repository's Conventional Commits check, which also
# validates pull request titles. "build" makes release.yml cut a patch release,
# so an updated Go module or builder image actually ships; "ci" does not.
# The distroless runtime image has no version tag to move; the weekly rebuild in
# docker-publish.yml refreshes it instead.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      go-modules:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
