name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This feature is not already present in the [latest release](https://github.com/Guliveer/twitch-miner-go/releases/latest)
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the use case, limitation, or pain point you're running into.
        "I want to be able to ..." is a good starting point.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you'd like to see, including any config changes or new options.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried or alternative approaches that could solve the problem.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links to similar features in other tools, code snippets, or anything else that helps.
