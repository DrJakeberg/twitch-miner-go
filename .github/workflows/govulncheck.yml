name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories are published without any change to this repository, so a
  # quiet week must still be checked.
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # govulncheck judges standard-library advisories against the Go version
      # that runs it, so it must use the toolchain the image is built with.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
