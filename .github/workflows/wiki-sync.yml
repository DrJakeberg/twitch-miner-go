name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - '.github/wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone wiki repository
        id: clone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
            wiki_repo 2>&1; then
            # A repository without a wiki is a normal state for a fork, not a
            # build failure. Skip the sync instead of failing every push.
            echo "::notice::Wiki repository not initialised — skipping wiki sync."
            echo "::notice::To enable it: Settings → General → Features → Wikis, then create the first page at https://github.com/${{ github.repository }}/wiki so GitHub initialises the wiki git repo."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy wiki pages
        if: steps.clone.outputs.skipped != 'true'
        run: cp .github/wiki/*.md wiki_repo/

      - name: Commit and push
        if: steps.clone.outputs.skipped != 'true'
        run: |
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to sync." && exit 0
          git commit -m "sync wiki from main@${{ github.sha }}"
          git push
