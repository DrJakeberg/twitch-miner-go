title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: >
        **Got a concrete, well-defined feature request?**
        [Open a Feature Request issue](https://github.com/Guliveer/twitch-miner-go/issues/new?template=feature_request.yml) instead — it gets tracked and prioritised in the backlog.
        Use this discussion for rough ideas, brainstorming, or anything you want community feedback on first.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing discussions and issues — this hasn't been suggested before
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or limitation you're running into.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Describe the behavior or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches that could solve the problem.
